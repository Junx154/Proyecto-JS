<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola mundo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>
<body>

  <div class="contact-container">
        
        <div class="contact-info">
            <div class="info-header">
                <span class="badge-text">Saludos</span>
                <h2>Conctáctanos</h2>
            </div>

           
            <div class="image-wrapper">
                <img src="img/f38d5516879bbc8f12930fa91a7865af.jpg" alt="Ilustración de contacto" class="side-image">
            </div>

            <button class="arrow-btn" type="button">&#10140;</button>
        </div>

        
        <div class="contact-form-container">
            <form action="php/enviar.php" method="POST" class="contact-form" id="form-contacto" >
                
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" placeholder="NOMBRE COMPLETO" required>
                </div>

                <div class="form-group">
                    <label for="company">Compañía</label>
                    <input type="text" id="company" placeholder="COMPANIA">
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" placeholder="NUMERO TELEFONICO">
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="CORREO ELECTRONICO" required>
                </div>

                <div class="form-group">
                    <label for="subject">Motivo del mensaje</label>
                    <input type="text" id="subject" placeholder="OBJECTIVO DEL MENSAJE O TEMA A TRATAR">
                </div>

                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" rows="4" placeholder="MENSAJE"></textarea>
                </div>

                <button type="submit" class="submit-btn">Enviar</button>
            </form>
        </div>
    </div>








   <!-- Cdn de SweetAlert2 -->
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
   <script src="js/app.js"></script>

</body>
</html>
